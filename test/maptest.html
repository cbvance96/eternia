<html><body style="margin:0;background:#173f52">
<canvas id="c" width="480" height="270" style="width:1440px;height:810px;image-rendering:pixelated"></canvas>
<script src="../src/01-core.js"></script><script src="../src/02-map.js"></script>
<script>
const t0=performance.now();
const m = generateMap();
const g = document.getElementById('c').getContext('2d');
g.fillStyle='#2b6474'; g.fillRect(0,0,W,H);
for(let i=0;i<W*H;i++){ if(!m.land[i] && m.waterDist[i]<6){ g.fillStyle='#3f8a95'; g.fillRect(i%W,(i/W)|0,1,1);} if(m.wet[i]){g.fillStyle='#4a9aa5'; g.fillRect(i%W,(i/W)|0,1,1);} }
g.drawImage(m.terrain,0,0);
g.fillStyle='rgba(255,0,0,.6)'; for(let y=0;y<H;y++) g.fillRect(m.borderX[y],y,1,1);
g.fillStyle='#000'; g.font='6px sans-serif';
for(const c of m.cities){ g.fillStyle=c.capital?'#f00':'#000'; g.fillRect(c.x-1,c.y-1,3,3); g.fillText(c.name+(c.side[0]),c.x+3,c.y+2);}
document.title = 'ms '+(performance.now()-t0).toFixed(0)+' cities '+m.cities.length+' islands '+m.islands.length;
</script></body></html>
